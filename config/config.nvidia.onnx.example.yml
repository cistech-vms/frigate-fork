# NVIDIA GPU profile for x86 hosts with Frigate headless.
# Copy this file to config/config.yml and adjust camera/model paths before first boot.

mqtt:
  host: mqtt

detectors:
  onnx:
    type: onnx

model:
  path: /config/model_cache/yolov9-t-320.onnx
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  hwaccel_args: preset-nvidia

go2rtc:
  streams:
    camera_main:
      - rtsp://usuario:senha@192.168.1.50:554/cam/realmonitor?channel=1&subtype=0
    camera_sub:
      - rtsp://usuario:senha@192.168.1.50:554/cam/realmonitor?channel=1&subtype=1

cameras:
  camera_exemplo:
    enabled: true
    audio:
      enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
    objects:
      track:
        - person
        - car
