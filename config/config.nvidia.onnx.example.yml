# NVIDIA GPU profile for x86 hosts with Frigate headless.
# Safe production bootstrap: no fake cameras, no placeholder IPs.
# Real cameras can be added later via config API or installer.

mqtt:
  host: mqtt

detectors:
  onnx:
    type: onnx

model:
  path: /config/model_cache/yolo.onnx
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  hwaccel_args: preset-nvidia

go2rtc:
  streams: {}

cameras: {}

version: 0.17-0
